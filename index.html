  createSlotUI(slot,sourceId,index,extra){
    const div=document.createElement('div');
    div.className='inv-slot'+(extra?' '+extra:'');
    if(this.draggingSlot&&this.draggingSlot.source===sourceId&&this.draggingSlot.index===index)div.classList.add('selected');
    if(slot.id!==0){
      const img=document.createElement('img');
      img.className='item-icon'; img.src=generateItemIconUrl(slot.id); div.appendChild(img);
      const count=document.createElement('div');count.className='inv-count';count.textContent=slot.count;div.appendChild(count);
      div.title=BLOCKS[slot.id]?BLOCKS[slot.id].name:'';
      div.onmouseenter=()=>this.showItemTooltip(slot.id);
    }
    div.onclick=()=>this.handleSlotClick(sourceId,index);
    return div;
  }

  renderInventory(){
    this.inventoryGrid.innerHTML='';
    this.player.inventory.slots.forEach((s,i)=>this.inventoryGrid.appendChild(this.createSlotUI(s,'inv',i)));
    // Hotbar in inventory
    this.hotbarGridInv.innerHTML='';
    this.player.inventory.hotbar.forEach((s,i)=>{
      const slot=this.createSlotUI(s,'hotbar',i,'hotbar-slot');
      if(this.player.inventory.selected===i)slot.classList.add('selected');
      this.hotbarGridInv.appendChild(slot);
    });
    if(this.uiState.chestOpenId){
      this.chestGrid.innerHTML='';
      const cSlots=this.world.chests[this.uiState.chestOpenId];
      cSlots.forEach((s,i)=>this.chestGrid.appendChild(this.createSlotUI(s,'chest',i)));
    }
  }

  handleSlotClick(source,index){
    const getSlot=(s,i)=>{
      if(s==='inv')return this.player.inventory.slots[i];
      if(s==='hotbar')return this.player.inventory.hotbar[i];
      if(s==='chest')return this.world.chests[this.uiState.chestOpenId][i];
      return null;
    };
    if(!this.draggingSlot){
      if(getSlot(source,index)&&getSlot(source,index).id!==0)this.draggingSlot={source,index};
    } else {
      const fromSlot=getSlot(this.draggingSlot.source,this.draggingSlot.index);
      const toSlot=getSlot(source,index);
      if(fromSlot&&toSlot){
        if(fromSlot.id===toSlot.id&&fromSlot.id!==0){toSlot.count+=fromSlot.count;fromSlot.id=0;fromSlot.count=0;}
        else{[fromSlot.id,toSlot.id]=[toSlot.id,fromSlot.id];[fromSlot.count,toSlot.count]=[toSlot.count,fromSlot.count];}
      }
      this.draggingSlot=null;
    }
    this.renderInventory();
  }

  // Drop dragging item when clicking outside inventory panels
  handleDropOutside(e){
    if(!this.draggingSlot)return;
    const panels=[this.inventoryPanel,this.chestPanel,this.craftingPanel];
    for(const p of panels){
      if(p&&p.style.display!=='none'&&p.contains(e.target))return;
    }
    const getSlot=(s,i)=>{
      if(s==='inv')return this.player.inventory.slots[i];
      if(s==='hotbar')return this.player.inventory.hotbar[i];
      if(s==='chest')return this.world.chests[this.uiState.chestOpenId]?.[i];
      return null;
    };
    const slot=getSlot(this.draggingSlot.source,this.draggingSlot.index);
    if(slot&&slot.id!==0){
      const drop=new ItemDrop(this.player.x+this.player.width/2,this.player.y,slot.id);
      drop.playerDropped=true; drop.dropCooldown=3000;
      for(let c=0;c<slot.count;c++) this.world.drops.push(new ItemDrop(this.player.x+this.player.width/2,this.player.y,slot.id));
      // Actually just one stack drop
      this.world.drops.pop(); // remove extras
      const d2=new ItemDrop(this.player.x+this.player.width/2,this.player.y,slot.id);
      d2.playerDropped=true; d2.dropCooldown=3000; d2.count=slot.count;
      this.world.drops.push(d2);
      slot.id=0;slot.count=0;
    }
    this.draggingSlot=null;
    this.renderInventory();
  }

  setupCraftingButtons(){
    const rbBtn=document.getElementById('recipe-browser-btn');
    if(rbBtn)rbBtn.onclick=()=>this.openRecipeBrowser();
    const closeRB=document.getElementById('close-recipe-browser');
    if(closeRB)closeRB.onclick=()=>{this.recipeBrowser.style.display='none';this.uiState.recipeBrowserOpen=false;};
    document.querySelectorAll('#recipe-browser-tabs button').forEach(btn=>{
      btn.onclick=()=>{
        document.querySelectorAll('#recipe-browser-tabs button').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        this.renderRecipeBrowser(btn.dataset.tab);
      };
    });
  }

  renderCraftingList(){
    const list=document.getElementById('crafting-list');list.innerHTML='';
    const availOnly=RECIPES.filter(r=>!(r.needsTable&&!this.nearCraftingTable));
    availOnly.forEach(r=>{
      const btn=document.createElement('button');btn.className='craft-btn';
      const canCraft=r.req.every(([id,cnt])=>this.player.inventory.countItem(id)>=cnt);
      btn.disabled=!canCraft;
      const reqText=r.req.map(([id,cnt])=>`${BLOCKS[id]?BLOCKS[id].name:'?'} x${cnt}`).join(', ');
      btn.innerHTML=`<span style="display:flex;align-items:center;gap:6px;"><img src="${generateItemIconUrl(r.out)}" style="width:20px;height:20px;image-rendering:pixelated;"> ${r.name} x${r.count}</span><span style="font-size:10px;color:#999">${reqText}</span>`;
      btn.onclick=()=>{
        if(!canCraft)return;
        r.req.forEach(([id,cnt])=>this.player.inventory.consumeItem(id,cnt));
        this.player.inventory.add(r.out,r.count);
        this.renderInventory();this.renderCraftingList();
      };
      list.appendChild(btn);
    });
  }

  openRecipeBrowser(){
    this.uiState.recipeBrowserOpen=true;
    this.recipeBrowser.style.display='block';
    this.renderRecipeBrowser('all');
  }

  renderRecipeBrowser(tab){
    const listEl=document.getElementById('recipe-browser-list');listEl.innerHTML='';
    let filtered=RECIPES;
    if(tab==='basic')filtered=RECIPES.filter(r=>!r.needsTable&&!r.isTool);
    else if(tab==='table')filtered=RECIPES.filter(r=>r.needsTable&&!r.isTool);
    else if(tab==='tools')filtered=RECIPES.filter(r=>r.isTool);
    filtered.forEach(r=>{
      const b=BLOCKS[r.out];
      const canCraft=r.req.every(([id,cnt])=>this.player.inventory.countItem(id)>=cnt);
      const div=document.createElement('div');div.className='recipe-entry';
      const reqText=r.req.map(([id,cnt])=>`<img src="${generateItemIconUrl(id)}" style="width:16px;height:16px;image-rendering:pixelated;vertical-align:middle;"> ${BLOCKS[id]?BLOCKS[id].name:'?'} x${cnt}`).join(' &nbsp;');
      div.innerHTML=`<div class="rout"><img src="${generateItemIconUrl(r.out)}" style="width:32px;height:32px;image-rendering:pixelated;"> <span><strong>${r.name}</strong><br><small>x${r.count}${r.needsTable?' (Table)':''}</small></span></div><div class="rreqs">${reqText}</div>`;
      const craftBtn=document.createElement('button');
      craftBtn.className='recipe-craftbtn';craftBtn.textContent=canCraft?'Craft':'Need more';craftBtn.disabled=!canCraft;
      if(canCraft)craftBtn.onclick=()=>{
        r.req.forEach(([id,cnt])=>this.player.inventory.consumeItem(id,cnt));
        this.player.inventory.add(r.out,r.count);
        this.renderInventory();this.renderCraftingList();this.renderRecipeBrowser(tab);
      };
      div.appendChild(craftBtn);
      listEl.appendChild(div);
    });
  }

  // --- MOB SPAWNING REWORK ---
  spawnMob(type,biomeId){
    const px=Math.floor(this.player.x/CONFIG.TILE_SIZE);
    for(let attempt=0;attempt<80;attempt++){
      const dx=Math.floor((Math.random()*2-1)*CONFIG.MOB_RADIUS);
      const x=px+dx;
      if(this.world.infinite&&x<0)continue;
      for(let y=0;y<this.world.height;y++){
        const id=this.world.getTile(x,y);
        const above=this.world.getTile(x,y-1);
        if(id!==0&&BLOCKS[id]&&BLOCKS[id].solid&&above===0){
          const bId=biomeId!==undefined?biomeId:this.world.getBiomeAt(x);
          const enemy=new Enemy(this.world,type,x*CONFIG.TILE_SIZE,(y-1)*CONFIG.TILE_SIZE-16,bId);
          this.enemies.push(enemy);
          return;
        }
      }
    }
  }

  updateMobs(dt,timeRatio){
    const isDay=timeRatio<0.5;
    const px=Math.floor(this.player.x/CONFIG.TILE_SIZE);
    const despawnDist=CONFIG.MOB_DESPAWN_RADIUS*CONFIG.TILE_SIZE;
    // Despawn far mobs
    this.enemies=this.enemies.filter(e=>{
      if(!e.alive)return false;
      const dist=Math.abs(e.x-this.player.x);
      return dist<despawnDist;
    });
    // Target 4 mobs
    const alive=this.enemies.filter(e=>e.alive).length;
    const spawn=CONFIG.MOB_TARGET-alive;
    if(spawn>0){
      for(let i=0;i<spawn;i++) this.spawnMob(isDay?'day':'night');
    }
    // Kill day mobs at night and vice versa (transition)
    if(!isDay&&timeRatio>0.55) this.enemies=this.enemies.filter(e=>e.type==='night'||!e.alive);
    if(isDay&&timeRatio<0.45) this.enemies=this.enemies.filter(e=>e.type==='day'||!e.alive);
    this.enemies.forEach(e=>e.update(this.player,dt));
  }

  handleEnemyClick(){
    const mx=this.input.mouse.x+this.camera.x,my=this.input.mouse.y+this.camera.y;
    for(let enemy of this.enemies){
      if(!enemy.alive)continue;
      const r={x:enemy.x,y:enemy.y,w:enemy.width,h:enemy.height};
      if(mx>=r.x&&mx<=r.x+r.w&&my>=r.y&&my<=r.y+r.h){
        let dmg=1;
        const held=this.player.inventory.hotbar[this.player.inventory.selected];
        if(held.id!==0&&BLOCKS[held.id]){
          const hb=BLOCKS[held.id];
          const baseDmg=hb.dmg||1;
          const mod=hb.shape==='sword'?3.5:hb.shape==='axe'?2:1;
          dmg=Math.round(baseDmg*mod);
        }
        enemy.hit(this.world,this.player,dmg);
        return true;
      }
    }
    return false;
  }

  // Right-click: place blocks / open chests / crafting table
  handleInteraction(){
    const wx=Math.floor((this.input.mouse.x+this.camera.x)/CONFIG.TILE_SIZE);
    const wy=Math.floor((this.input.mouse.y+this.camera.y)/CONFIG.TILE_SIZE);
    const pdx=(this.player.x+this.player.width/2)-(wx*CONFIG.TILE_SIZE+16);
    const pdy=(this.player.y+this.player.height/2)-(wy*CONFIG.TILE_SIZE+16);
    if(Math.hypot(pdx,pdy)>160)return;
    const currentTile=this.world.getTile(wx,wy);
    if(currentTile===30){this.openChest(wx,wy);return;}
    if(currentTile===31){this.toggleInventory();return;}
    const blockToPlace=this.player.inventory.getCurrentId();
    if(blockToPlace===200){if(this.player.inventory.removeCurrent()){this.player.eat(25);this.spawnEatText();}return;}
    if(currentTile!==0||blockToPlace===0)return;
    if(BLOCKS[blockToPlace]&&BLOCKS[blockToPlace].isItem&&!BLOCKS[blockToPlace].isBlock)return;
    const tileRect={x:wx*32,y:wy*32,w:32,h:32};
    const pRect={x:this.player.x,y:this.player.y,w:this.player.width,h:this.player.height};
    if(!Utils.rectIntersect(pRect,tileRect)||!BLOCKS[blockToPlace].solid){
      if(this.player.inventory.removeCurrent()){
        this.world.setTile(wx,wy,blockToPlace,true);
        if(this.mp?.connections?.size){const _pm=JSON.stringify({type:'place',wx,wy,id:blockToPlace});this.mp.connections.forEach(c=>{if(c.open)c.send(_pm);});}
      }
    }
  }

  // Left-click: per-click multi-hit mining
  mineTileClick(){
    const wx=Math.floor((this.input.mouse.x+this.camera.x)/CONFIG.TILE_SIZE);
    const wy=Math.floor((this.input.mouse.y+this.camera.y)/CONFIG.TILE_SIZE);
    const pdx=(this.player.x+this.player.width/2)-(wx*CONFIG.TILE_SIZE+16);
    const pdy=(this.player.y+this.player.height/2)-(wy*CONFIG.TILE_SIZE+16);
    if(Math.hypot(pdx,pdy)>160)return;
    const blockId=this.world.getTile(wx,wy);
    if(blockId===0||blockId===99)return;
    const toolId=this.player.inventory.getCurrentId();
    const needed=mineHits(toolId,blockId);
    const key=`${wx},${wy}`;
    if(!this.mineTarget||this.mineTarget.key!==key){
      this.mineTarget={key,wx,wy,blockId,hits:0,needed};
    }
    // particles on each hit
    this.world.addParticles(wx*CONFIG.TILE_SIZE,wy*CONFIG.TILE_SIZE,BLOCKS[blockId]?BLOCKS[blockId].color:'#aaa');
    if(needed===0){this.breakBlock(wx,wy,blockId,toolId);this.mineTarget=null;return;}
    this.mineTarget.hits++;
    if(this.mineTarget.hits>=this.mineTarget.needed){
      this.breakBlock(wx,wy,blockId,toolId);
      this.mineTarget=null;
    }
  }

  breakBlock(wx,wy,blockId,toolId){
    const area=shovelArea(toolId,blockId,wx,wy);
    if(area){
      for(let y=area.y0;y<=area.y1;y++){
        for(let x=area.x0;x<=area.x1;x++){
          const id=this.world.getTile(x,y);
          if(id!==0&&id!==99){
            this.world.setTile(x,y,0,true);
            this.world.addDrop(x*CONFIG.TILE_SIZE+10,y*CONFIG.TILE_SIZE+10,id);
            this.world.addParticles(x*CONFIG.TILE_SIZE,y*CONFIG.TILE_SIZE,BLOCKS[id]?BLOCKS[id].color:'#aaa');
            if(this.mp?.connections?.size){const _bm=JSON.stringify({type:'break',wx:x,wy:y});this.mp.connections.forEach(c=>{if(c.open)c.send(_bm);});}
          }
        }
      }
    } else {
      this.world.setTile(wx,wy,0,true);
      this.world.addDrop(wx*CONFIG.TILE_SIZE+10,wy*CONFIG.TILE_SIZE+10,blockId);
      this.world.addParticles(wx*CONFIG.TILE_SIZE,wy*CONFIG.TILE_SIZE,BLOCKS[blockId]?BLOCKS[blockId].color:'#aaa');
      if(blockId===30)delete this.world.chests[`${wx},${wy}`];
      if(this.mp?.connections?.size){const _bm2=JSON.stringify({type:'break',wx,wy});this.mp.connections.forEach(c=>{if(c.open)c.send(_bm2);});}
    }
  }

  spawnEatText(){
    const p=["Yummy!","Yum!","Tasty!","Delicious!","+Hunger"];
    this.floatTexts.push({text:p[Math.floor(Math.random()*p.length)],x:this.player.x+this.player.width/2,y:this.player.y-10,vy:-0.3,life:1000});
  }

  update(dt){
    this.gameTime+=dt;
    // Inject touch joystick into keys
    if(this.touchJoy){
      this.input.keys['KeyA']=this.touchJoy.x<-0.2;
      this.input.keys['KeyD']=this.touchJoy.x>0.2;
      if(this.touchJoy.y<-0.5) this.input.keys['Space']=true;
    }
    if(this.touchJumpPressed){this.input.keys['Space']=true;this.touchJumpPressed=false;}
    this.player.update(this.input,this.world,dt);
    // Clear touch space after player update
    if(this.touchJoy&&this.touchJoy.y>=-0.5)this.input.keys['Space']=false;
    // Update drop cooldowns
    for(const drop of this.world.drops){
      if(drop.playerDropped&&drop.dropCooldown>0)drop.dropCooldown-=dt;
    }
    this.world.drops.forEach(d=>d.update(this.world,this.player));
    this.world.drops=this.world.drops.filter(d=>!d.collected);
    this.world.particles.forEach(p=>p.update());
    this.world.particles=this.world.particles.filter(p=>p.life>0);
    this.world.hitTexts.forEach(t=>{t.y+=t.vy;t.life-=dt;});
    this.world.hitTexts=this.world.hitTexts.filter(t=>t.life>0);
    this.floatTexts.forEach(t=>{t.y+=t.vy;t.life-=dt;});
    this.floatTexts=this.floatTexts.filter(t=>t.life>0);
    this.camera.x+=((this.player.x-this.canvas.width/2)-this.camera.x)*0.1;
    this.camera.y+=((this.player.y-this.canvas.height/2)-this.camera.y)*0.1;
    const minCamX=this.world.infinite?0:0;
    const maxCamX=this.world.infinite?this.player.x+this.canvas.width:this.world.width*32-this.canvas.width;
    this.camera.x=Utils.clamp(this.camera.x,minCamX,maxCamX);
    this.camera.y=Utils.clamp(this.camera.y,0,this.world.height*32-this.canvas.height);
    // Right-click held = continuous place/interact; left-click mining is per-click only
    if(this.input.mouse.right&&!this.uiState.inv&&!this.uiState.craft)this.handleInteraction();
    this.updateMP(dt);
    this.updateMobs(dt,(this.gameTime%CONFIG.DAY_LENGTH)/CONFIG.DAY_LENGTH);
    // Biome label
    const px=Math.floor(this.player.x/CONFIG.TILE_SIZE);
    const biomeId=this.world.getBiomeAt(px);
    this.currentBiomeName=BIOME_DEFS[biomeId]?BIOME_DEFS[biomeId].name:'Surface';
    document.getElementById('biome-label').textContent=this.currentBiomeName;
    // Hotbar tooltip on change
    if(this.player.inventory.selected!==this.lastHotbarSelected){
      this.lastHotbarSelected=this.player.inventory.selected;
      this.showItemTooltip(this.player.inventory.getCurrentId());
    }
  }

  drawSky(timeRatio){
    const ctx=this.ctx;let skyColor,darkness=0;
    const biomeId=this.world.getBiomeAt(Math.floor(this.player.x/CONFIG.TILE_SIZE));
    const isWarped=biomeId===4;
    if(isWarped){
      skyColor=ctx.createLinearGradient(0,0,0,this.canvas.height);
      skyColor.addColorStop(0,'#0d0020');skyColor.addColorStop(1,'#1a0040');
    } else if(timeRatio<0.2){skyColor=ctx.createLinearGradient(0,0,0,this.canvas.height);skyColor.addColorStop(0,'#4a90e2');skyColor.addColorStop(1,'#ff7e5f');}
    else if(timeRatio<0.4)skyColor=biomeId===1?'#c0d8f0':'#87CEEB';
    else if(timeRatio<0.6){skyColor=ctx.createLinearGradient(0,0,0,this.canvas.height);skyColor.addColorStop(0,'#2b5876');skyColor.addColorStop(1,'#4e4376');}
    else{skyColor='#0b1021';darkness=Math.min(0.85,Math.sin((timeRatio-0.5)*Math.PI)*1.5);}
    ctx.fillStyle=skyColor;ctx.fillRect(0,0,this.canvas.width,this.canvas.height);
    if(timeRatio>0.4||isWarped){
      ctx.fillStyle=isWarped?'rgba(180,80,255,0.8)':'white';
      ctx.globalAlpha=Math.min(1,(timeRatio-0.4)*3+(isWarped?0.5:0));
      this.stars.forEach(s=>ctx.fillRect(s.x*this.canvas.width,s.y*this.canvas.height,s.size,s.size));
      ctx.globalAlpha=1;
    }
    if(!isWarped){
      const angle=(timeRatio*Math.PI*2)-Math.PI/2,cx2=this.canvas.width/2,cy2=this.canvas.height,radius=this.canvas.width*0.45;
      ctx.fillStyle='#FFD700';ctx.beginPath();ctx.arc(cx2+Math.cos(angle)*radius,cy2+Math.sin(angle)*radius,40,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#E0E0E0';ctx.beginPath();ctx.arc(cx2+Math.cos(angle+Math.PI)*radius,cy2+Math.sin(angle+Math.PI)*radius,30,0,Math.PI*2);ctx.fill();
    } else {
      // Warped moon - purple
      ctx.fillStyle='#cc44ff';ctx.beginPath();ctx.arc(this.canvas.width*0.7,this.canvas.height*0.15,35,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(0,0,0,0.5)';ctx.beginPath();ctx.arc(this.canvas.width*0.7+12,this.canvas.height*0.15-5,28,0,Math.PI*2);ctx.fill();
    }
    return darkness;
  }

  drawUI(timeRatio){
    const heartSize=14,startX=20,startY=90;
    let hp=Math.max(0,this.player.hp);
    let fullHearts=Math.floor(hp/2),halfHeart=(hp%2)>=1;
    for(let i=0;i<10;i++){
      let hx=startX+i*(heartSize+4);
      this.ctx.fillStyle='#111';this.ctx.fillRect(hx-1,startY-1,heartSize+2,heartSize+2);
      if(i<fullHearts){this.ctx.fillStyle='#d32f2f';this.ctx.fillRect(hx,startY,heartSize,heartSize);}
      else if(i===fullHearts&&halfHeart){this.ctx.fillStyle='#d32f2f';this.ctx.fillRect(hx,startY,heartSize/2,heartSize);this.ctx.fillStyle='#444';this.ctx.fillRect(hx+heartSize/2,startY,heartSize/2,heartSize);}
      else{this.ctx.fillStyle='#444';this.ctx.fillRect(hx,startY,heartSize,heartSize);}
      // Heart shape hint
      this.ctx.fillStyle='rgba(255,255,255,0.15)';this.ctx.fillRect(hx+2,startY+2,4,3);
    }
    // Hunger bar
    this.ctx.fillStyle='#222';this.ctx.fillRect(20,115,160,10);
    const hungerColor=this.player.hunger>50?'#ffb74d':this.player.hunger>25?'#ff8c00':'#e53935';
    this.ctx.fillStyle=hungerColor;this.ctx.fillRect(20,115,(this.player.hunger/this.player.maxHunger)*160,10);
    this.ctx.strokeStyle='rgba(255,255,255,0.3)';this.ctx.lineWidth=1;this.ctx.strokeRect(20,115,160,10);
    // Hunger icon
    this.ctx.fillStyle='#ffb74d';this.ctx.font='10px Arial';this.ctx.fillText('🍖',2,124);

    // Hotbar
    const slots=this.player.inventory.hotbar;
    const hStartX=20,hStartY=135,size=48,gap=6;
    for(let i=0;i<5;i++){
      const x=hStartX+(size+gap)*i;
      this.ctx.fillStyle='rgba(0,0,0,0.65)';this.ctx.fillRect(x,hStartY,size,size);
      this.ctx.lineWidth=this.player.inventory.selected===i?3:1;
      this.ctx.strokeStyle=this.player.inventory.selected===i?'#ffeb3b':'rgba(255,255,255,0.3)';
      this.ctx.strokeRect(x,hStartY,size,size);
      const slot=slots[i];
      if(slot.id!==0){
        const b=BLOCKS[slot.id];
        if(b){
          this.ctx.save();this.ctx.imageSmoothingEnabled=false;
          if(b.isItem&&b.type==='tool') drawToolShape(this.ctx,b.shape,b.color,b.color2,x+8,hStartY+8,32);
          else drawBlockSprite(this.ctx,slot.id,x+8,hStartY+8,32);
          this.ctx.restore();
          this.ctx.fillStyle='white';this.ctx.font='bold 11px Arial';
          this.ctx.fillText(slot.count,x+3,hStartY+size-4);
        }
      }
      this.ctx.fillStyle='rgba(200,200,200,0.7)';this.ctx.font='bold 10px Arial';this.ctx.fillText(i+1,x+3,hStartY+12);
    }
    const phase=timeRatio<0.5?"Day":"Night";
    document.getElementById('debug-info').innerHTML=`${phase} | ${Math.floor(this.player.x/32)},${Math.floor(this.player.y/32)}`;
  }

  drawMinimap(timeRatio){
    const destCtx=this.minimapCtx;if(!destCtx)return;
    destCtx.clearRect(0,0,this.minimapCanvas.width,this.minimapCanvas.height);
    destCtx.imageSmoothingEnabled=false;
    if(!this.world.infinite){
      const scaleX=this.minimapCanvas.width/this.world.width,scaleY=this.minimapCanvas.height/this.world.height;
      destCtx.save();destCtx.scale(scaleX,scaleY);destCtx.drawImage(this.world.minimapCanvas,0,0);destCtx.restore();
      destCtx.fillStyle='#ffeb3b';destCtx.beginPath();destCtx.arc((this.player.x/CONFIG.TILE_SIZE)*scaleX,(this.player.y/CONFIG.TILE_SIZE)*scaleY,3,0,Math.PI*2);destCtx.fill();
    } else {
      // For infinite world, draw visible area around player
      destCtx.fillStyle='#0a0f1e';destCtx.fillRect(0,0,this.minimapCanvas.width,this.minimapCanvas.height);
      const viewTiles=100;
      const px=Math.floor(this.player.x/CONFIG.TILE_SIZE);
      const scaleX=this.minimapCanvas.width/viewTiles,scaleY=this.minimapCanvas.height/this.world.height;
      for(let x=px-viewTiles/2;x<px+viewTiles/2;x++){
        for(let y=0;y<this.world.height;y++){
          const id=this.world.getTile(x,y);
          const b=BLOCKS[id];if(!b||!b.color)continue;
          const c=hexToRgb(b.color);
          destCtx.fillStyle=`rgb(${c.r},${c.g},${c.b})`;
          destCtx.fillRect((x-px+viewTiles/2)*scaleX,y*scaleY,Math.ceil(scaleX),Math.ceil(scaleY));
        }
      }
      destCtx.fillStyle='#ffeb3b';
      destCtx.fillRect(this.minimapCanvas.width/2-3,((this.player.y/CONFIG.TILE_SIZE))*scaleY-3,6,6);
    }
    if(timeRatio>0.6||timeRatio<0.1){destCtx.fillStyle='rgba(0,0,30,0.4)';destCtx.fillRect(0,0,this.minimapCanvas.width,this.minimapCanvas.height);}
  }

  draw(){
    const timeRatio=(this.gameTime%CONFIG.DAY_LENGTH)/CONFIG.DAY_LENGTH;
    const darknessLevel=this.drawSky(timeRatio);
    const ts=CONFIG.TILE_SIZE;
    const startCol=Math.max(0,Math.floor(this.camera.x/ts));
    const endCol=Math.min(this.world.infinite?startCol+80:this.world.width,startCol+(this.canvas.width/ts)+2);
    const startRow=Math.max(0,Math.floor(this.camera.y/ts));
    const endRow=Math.min(this.world.height,startRow+(this.canvas.height/ts)+2);

    let lightPoints=[];
    for(let y=startRow;y<endRow;y++){
      for(let x=startCol;x<endCol;x++){
        const id=this.world.getTile(x,y);
        if(BLOCKS[id]&&BLOCKS[id].light)lightPoints.push({x:x*ts-this.camera.x+16,y:y*ts-this.camera.y+16,r:id===27?80:100});
      }
    }

    this.ctx.imageSmoothingEnabled=false;
    for(let y=startRow;y<endRow;y++){
      for(let x=startCol;x<endCol;x++){
        const id=this.world.getTile(x,y);
        if(id!==0){
          const px2=Math.floor(x*ts-this.camera.x),py2=Math.floor(y*ts-this.camera.y);
          // Pass world tile coords x,y so ore seed is stable across camera movement
          drawBlockSprite(this.ctx,id,px2,py2,ts,x,y);
        }
      }
    }

    this.world.drops.forEach(d=>d.draw(this.ctx,this.camera));
    this.enemies.forEach(e=>e.draw(this.ctx,this.camera));
    this.player.draw(this.ctx,this.camera);
    this.world.particles.forEach(p=>p.draw(this.ctx,this.camera));

    this.ctx.font='bold 12px Arial';
    this.world.hitTexts.forEach(t=>{
      this.ctx.fillStyle='#ff5252';this.ctx.globalAlpha=Math.max(0,t.life/600);
      this.ctx.fillText(t.text,t.x-this.camera.x,t.y-this.camera.y);
    });
    this.ctx.font='bold 14px Arial';
    this.floatTexts.forEach(t=>{
      this.ctx.fillStyle='#ffeb3b';this.ctx.globalAlpha=Math.max(0,t.life/1000);
      this.ctx.fillText(t.text,t.x-this.camera.x,t.y-this.camera.y);
    });
    this.ctx.globalAlpha=1;

    // Darkness overlay with light punches
    if(darknessLevel>0){
      const psx=this.player.x+this.player.width/2-this.camera.x,psy=this.player.y+this.player.height/2-this.camera.y;
      this.ctx.save();this.ctx.fillStyle=`rgba(5,5,15,${darknessLevel})`;
      this.ctx.beginPath();this.ctx.rect(0,0,this.canvas.width,this.canvas.height);
      const punch=(x,y,r)=>{this.ctx.moveTo(x,y);this.ctx.arc(x,y,r,0,Math.PI*2,true);};
      punch(psx,psy,160);
      lightPoints.forEach(lp=>punch(lp.x,lp.y,lp.r||100));
      this.ctx.fill();
      const grad=(x,y,r1,r2,col)=>{const lg=this.ctx.createRadialGradient(x,y,r1,x,y,r2);lg.addColorStop(0,col);lg.addColorStop(1,'rgba(0,0,0,0)');this.ctx.fillStyle=lg;this.ctx.beginPath();this.ctx.arc(x,y,r2,0,Math.PI*2);this.ctx.fill();};
      grad(psx,psy,20,160,'rgba(255,230,150,0.2)');
      lightPoints.forEach(lp=>{
        const col=lp.r===80?'rgba(180,80,255,0.3)':'rgba(255,200,50,0.3)';
        grad(lp.x,lp.y,10,lp.r||100,col);
      });
      this.ctx.restore();
    }

    // Warped Kingdom color tint
    const biomeId=this.world.getBiomeAt(Math.floor(this.player.x/CONFIG.TILE_SIZE));
    if(biomeId===4){
      this.ctx.fillStyle='rgba(60,0,100,0.12)';this.ctx.fillRect(0,0,this.canvas.width,this.canvas.height);
    }

    // ── Mining crack overlay ──────────────────────────────────────────────
    if(this.mineTarget&&this.mineTarget.needed>0&&this.mineTarget.hits>0){
      const{wx,wy,hits,needed}=this.mineTarget;
      const progress=hits/needed;
      const ts=CONFIG.TILE_SIZE;
      const px2=Math.floor(wx*ts-this.camera.x);
      const py2=Math.floor(wy*ts-this.camera.y);
      this.ctx.save();
      this.ctx.fillStyle=`rgba(0,0,0,${0.15+progress*0.45})`;
      this.ctx.fillRect(px2,py2,ts,ts);
      this.ctx.strokeStyle=`rgba(30,10,0,${0.5+progress*0.4})`;
      this.ctx.lineWidth=1;
      const lines=Math.floor(progress*7)+1;
      for(let i=0;i<lines;i++){
        const lx=px2+3+(i*6)%(ts-6);
        const ly=py2+2+(i*5)%(ts-8);
        this.ctx.beginPath();this.ctx.moveTo(lx,ly);this.ctx.lineTo(lx+5,ly+ts-6);this.ctx.stroke();
      }
      this.ctx.strokeStyle=`rgba(255,255,255,${0.25+progress*0.25})`;
      this.ctx.lineWidth=2;
      this.ctx.strokeRect(px2+1,py2+1,ts-2,ts-2);
      this.ctx.restore();
    }

    // ── Other multiplayer players ─────────────────────────────────────────
    if(this.mp){
      const ctx=this.ctx;
      const now=Date.now();
      this.mp.players.forEach(p=>{
        // Smooth interpolation — lerp toward target position
        if(p.tx===undefined){p.tx=p.x;p.ty=p.y;p.rx=p.x;p.ry=p.y;}
        // Store network target
        if(p.x!==p.tx||p.y!==p.ty){p.tx=p.x;p.ty=p.y;}
        // Smooth render pos toward target
        p.rx=p.rx+(p.tx-p.rx)*0.25;
        p.ry=p.ry+(p.ty-p.ry)*0.25;
        const sx=Math.floor(p.rx-this.camera.x);
        const sy=Math.floor(p.ry-this.camera.y);
        ctx.save();
        // Body
        ctx.fillStyle='#c62828';ctx.fillRect(sx,sy+14,20,26);
        // Legs
        ctx.fillStyle='#4a148c';ctx.fillRect(sx,sy+34,8,10);ctx.fillRect(sx+12,sy+34,8,10);
        // Head
        ctx.fillStyle='#ffccbc';ctx.fillRect(sx-2,sy,24,14);
        // Eyes
        ctx.fillStyle='#212121';
        if(p.facingRight){ctx.fillRect(sx+14,sy+4,4,4);}
        else{ctx.fillRect(sx+2,sy+4,4,4);}
        // Name tag — always shown, cyan
        const nameLabel=p.name||'?';
        ctx.font='bold 11px Arial';
        const nameW=ctx.measureText(nameLabel).width+10;
        ctx.fillStyle='rgba(0,0,0,0.75)';
        ctx.fillRect(sx+10-nameW/2,sy-24,nameW,16);
        ctx.fillStyle='#7cf';
        ctx.textAlign='center';
        ctx.fillText(nameLabel,sx+10,sy-12);
        ctx.textAlign='left';
        ctx.restore();
      });
    }

    this.drawUI(timeRatio);this.drawMinimap(timeRatio);
  }

  // ── Multiplayer (PeerJS peer-to-peer — no server required) ──────────────
  connectMP(playerName, isHost, joinCode){
    // mp state: peer=PeerJS instance, connections=Map<id,DataConnection>, players=Map<id,{...}>
    this.mp={peer:null,playerName,isHost,roomCode:null,playerId:null,players:new Map(),sendTimer:0,connections:new Map()};

    // Helper: broadcast a message to all connected peers (host broadcasts to all guests; guest sends to host)
    const broadcast=(msg,excludeId=null)=>{
      const json=JSON.stringify(msg);
      this.mp.connections.forEach((conn,id)=>{
        if(id!==excludeId && conn.open) conn.send(json);
      });
    };

    // Helper: handle an incoming parsed message (shared by host and guest)
    const handleMsg=(msg,fromId)=>{
      if(msg.type==='hello'){
        // A guest introduced themselves to the host
        if(isHost){
          // Tell the new guest about all existing players
          const existing=[];
          this.mp.players.forEach(p=>existing.push(p));
          const conn=this.mp.connections.get(fromId);
          if(conn&&conn.open) conn.send(JSON.stringify({type:'joined',code:this.mp.roomCode,playerId:fromId,players:existing}));
          // Tell everyone else about the new player
          broadcast({type:'playerJoin',id:fromId,name:msg.name,x:msg.x,y:msg.y},fromId);
          // Add to our own list
          this.mp.players.set(fromId,{id:fromId,name:msg.name,x:msg.x,y:msg.y,facingRight:true});
          this.addChatMessage(`${msg.name} joined!`,'sys');
        }
      } else if(msg.type==='joined'){
        // Guest received ack from host
        this.mp.roomCode=msg.code; this.mp.playerId=msg.playerId;
        msg.players.forEach(p=>this.mp.players.set(p.id,{...p,rx:p.x,ry:p.y,tx:p.x,ty:p.y}));
        this._showRoomHud(msg.code);
        this.addChatMessage(`Joined room ${msg.code}${msg.players.length?` — ${msg.players.length} player(s) here`:''}!`,'sys');
      } else if(msg.type==='playerJoin'){
        this.mp.players.set(msg.id,{id:msg.id,name:msg.name,x:msg.x,y:msg.y,facingRight:true,rx:msg.x,ry:msg.y,tx:msg.x,ty:msg.y});
        this.addChatMessage(`${msg.name} joined!`,'sys');
      } else if(msg.type==='move'){
        // Host relays move packets to all other peers
        if(isHost) broadcast(msg,fromId);
        const p=this.mp.players.get(msg.id);
        if(p){
          // Update network target; draw loop smoothly lerps rx/ry toward these
          p.x=msg.x;p.y=msg.y;p.facingRight=msg.facingRight;
        }
        // Only create a placeholder if we truly don't know this player yet; never overwrite name with '?'
        else if(msg.name) this.mp.players.set(msg.id,{id:msg.id,name:msg.name,x:msg.x,y:msg.y,facingRight:msg.facingRight,rx:msg.x,ry:msg.y,tx:msg.x,ty:msg.y});
      } else if(msg.type==='break'){
        if(isHost) broadcast(msg,fromId);
        const id=this.world.getTile(msg.wx,msg.wy);
        if(id&&id!==0&&id!==99){this.world.setTile(msg.wx,msg.wy,0,true);
          this.world.addParticles(msg.wx*CONFIG.TILE_SIZE,msg.wy*CONFIG.TILE_SIZE,BLOCKS[id]?.color||'#aaa');}
      } else if(msg.type==='place'){
        if(isHost) broadcast(msg,fromId);
        if(this.world.getTile(msg.wx,msg.wy)===0)this.world.setTile(msg.wx,msg.wy,msg.id,true);
      } else if(msg.type==='leave'){
        if(isHost) broadcast(msg,fromId);
        const p=this.mp.players.get(msg.id);
        if(p)this.addChatMessage(`${p.name} left.`,'sys');
        this.mp.players.delete(msg.id);
        this.mp.connections.delete(fromId);
      }
    };

    // Setup an incoming DataConnection (used by host for every guest that connects)
    const setupConn=(conn)=>{
      const peerId=conn.peer;
      this.mp.connections.set(peerId,conn);
      conn.on('data',raw=>{
        try{ handleMsg(JSON.parse(raw),peerId); } catch(_){}
      });
      conn.on('close',()=>{
        const p=this.mp.players.get(peerId);
        if(p) this.addChatMessage(`${p.name} left.`,'sys');
        this.mp.players.delete(peerId);
        this.mp.connections.delete(peerId);
        broadcast({type:'leave',id:peerId});
      });
      conn.on('error',()=>{
        this.mp.connections.delete(peerId);
      });
    };

    if(isHost){
      // Host: create a Peer with a random 6-char room code as ID
      const code=(joinCode||Array.from({length:6},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join(''));
      const peer=new Peer('SRLM-'+code,{debug:0});
      this.mp.peer=peer;
      this.mp.roomCode=code;
      this.mp.playerId='host';

      peer.on('open',()=>{
        this._showRoomHud(code);
        this._showCodeToast(code);
        this.addChatMessage(`Hosting room ${code} — share this code with your friend!`,'sys');
      });
      peer.on('connection',conn=>{
        conn.on('open',()=>setupConn(conn));
      });
      peer.on('error',err=>{
        this.addChatMessage('Multiplayer error: '+(err.message||err),'kill');
      });

    } else {
      // Guest: connect to the host's peer ID
      const code=joinCode.toUpperCase();
      const peer=new Peer({debug:0});
      this.mp.peer=peer;
      this.mp.playerId=null;

      peer.on('open',myId=>{
        this.mp.playerId=myId;
        const conn=peer.connect('SRLM-'+code,{reliable:true});
        this.mp.connections.set('host',conn);
        conn.on('open',()=>{
          // Send hello / introduce ourselves
          conn.send(JSON.stringify({type:'hello',name:playerName,
            x:Math.round(this.player.x),y:Math.round(this.player.y)}));
          this.mp.roomCode=code;
          this._showRoomHud(code);
        });
        conn.on('data',raw=>{
          try{ handleMsg(JSON.parse(raw),'host'); } catch(_){}
        });
        conn.on('close',()=>{
          this.addChatMessage('Disconnected from host.','sys');
          this.mp=null;
          const hud=document.getElementById('room-code-hud');
          if(hud)hud.style.display='none';
        });
        conn.on('error',()=>{
          this.addChatMessage('Could not connect to room '+code+' — make sure the host is online and the code is correct.','kill');
        });
      });
      peer.on('error',err=>{
        this.addChatMessage('Multiplayer error: '+(err.message||err),'kill');
      });
    }
  }

  _showRoomHud(code){
    const hud=document.getElementById('room-code-hud');
    if(!hud)return;
    hud.textContent=`Room: ${code}  📋`;hud.style.display='block';
    hud.onclick=()=>{navigator.clipboard.writeText(code).catch(()=>{});
      hud.textContent='✓ Copied!';setTimeout(()=>hud.textContent=`Room: ${code}  📋`,1400);};
  }

  _showCodeToast(code){
    const t=document.createElement('div');
    t.style.cssText=`position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
      background:#1a237e;border:3px solid #7986cb;border-radius:16px;padding:28px 40px;
      text-align:center;z-index:9999;font-family:monospace;`;
    t.innerHTML=`<div style="color:#aaa;font-size:13px;margin-bottom:8px;">YOUR ROOM CODE</div>
      <div style="font-size:42px;font-weight:bold;letter-spacing:10px;color:#fff;">${code}</div>
      <div style="color:#7986cb;font-size:12px;margin-top:10px;">Click the code in the top-right to copy it anytime</div>
      <div style="color:#555;font-size:11px;margin-top:18px;">( click anywhere to close )</div>`;
    document.body.appendChild(t);
    t.onclick=()=>t.remove();
    setTimeout(()=>{if(t.parentNode)t.remove();},8000);
  }

  disconnectMP(){
    if(this.mp){
      try{
        this.mp.connections.forEach(c=>{try{c.close();}catch(_){}});
        this.mp.peer?.destroy();
      }catch(_){}
      this.mp=null;
    }
    const hud=document.getElementById('room-code-hud');
    if(hud)hud.style.display='none';
  }

  updateMP(dt){
    if(!this.mp?.connections||this.mp.connections.size===0)return;
    this.mp.sendTimer=(this.mp.sendTimer||0)+dt;
    if(this.mp.sendTimer>=50){
      this.mp.sendTimer=0;
      const msg=JSON.stringify({type:'move',id:this.mp.playerId,name:this.mp.playerName,
        x:Math.round(this.player.x),y:Math.round(this.player.y),
        facingRight:!!this.player.facingRight});
      this.mp.connections.forEach(conn=>{if(conn.open)conn.send(msg);});
    }
  }

  loop(timestamp){
    const dt=timestamp-this.lastFrame;this.lastFrame=timestamp;
    this.update(dt);this.draw();
    this.animationId=requestAnimationFrame(this.loop);
  }
}

// APP / MENUS
// ============================================================
function generateSeed(){return Math.floor(Math.random()*1000000000).toString(36);}
function hashSeed(seed){let h=0;for(let i=0;i<seed.length;i++){h=(h<<5)-h+seed.charCodeAt(i);h|=0;}return Math.abs(h);}
function hexToRgb(hex){
  if(!hex)return{r:128,g:128,b:128};
  hex=hex.replace('#','');if(hex.length===3)hex=hex.split('').map(c=>c+c).join('');
  const n=parseInt(hex,16);return{r:(n>>16)&255,g:(n>>8)&255,b:n&255};
}

const App = {
  currentMenu:null,
  controlMode: localStorage.getItem('controlMode')||'keyboard', // 'keyboard','touch','controller'
  data:{
    worlds:JSON.parse(localStorage.getItem("worlds")||"[]"),
    characters:JSON.parse(localStorage.getItem("characters")||"[]"),
    profile:JSON.parse(localStorage.getItem("profile")||'{"name":"Player"}'),
    mpWorlds:JSON.parse(localStorage.getItem("mpWorlds")||"[]")
  },
  save(){
    localStorage.setItem("worlds",JSON.stringify(this.data.worlds));
    localStorage.setItem("characters",JSON.stringify(this.data.characters));
    localStorage.setItem("profile",JSON.stringify(this.data.profile));
    localStorage.setItem("mpWorlds",JSON.stringify(this.data.mpWorlds));
  },
  switch(menu){this.currentMenu=menu;const c=document.getElementById("menu-app");c.innerHTML="";c.appendChild(menu.render());},
  openSettings(){
    const ov=document.getElementById('settings-overlay');
    if(!ov)return;
    ov.style.display='flex';
    // Sync radio
    document.querySelectorAll('.ctrl-option').forEach(el=>{
      el.classList.toggle('selected',el.dataset.ctrl===this.controlMode);
      const r=el.querySelector('input');if(r)r.checked=(el.dataset.ctrl===this.controlMode);
    });
  },
  closeSettings(){
    const ov=document.getElementById('settings-overlay');
    if(ov)ov.style.display='none';
  },
  setControl(mode){
    this.controlMode=mode;
    localStorage.setItem('controlMode',mode);
    document.querySelectorAll('.ctrl-option').forEach(el=>{
      el.classList.toggle('selected',el.dataset.ctrl===mode);
      const r=el.querySelector('input');if(r)r.checked=(el.dataset.ctrl===mode);
    });
    if(window.gameInstance)window.gameInstance.applyControlMode(mode);
  },
  returnToMenu(){
    if(window.gameInstance){window.gameInstance.disconnectMP();window.gameInstance.stop?.();window.gameInstance=null;}
    document.getElementById("game-container").classList.add("hidden");
    document.getElementById("menu-app").classList.remove("hidden");
    App.switch(new WorldMenu());
  },
  launchGame(world, opts={}){
    document.getElementById("menu-app").classList.add("hidden");
    document.getElementById("game-container").classList.remove("hidden");
    window.gameInstance=new Game(world);
    window.gameInstance.applyControlMode(this.controlMode);
    if(opts.mp){
      const name=App.data.profile.name||'Player';
      setTimeout(()=>{
        if(window.gameInstance)
          window.gameInstance.connectMP(name, opts.isHost, opts.code||null);
      },600);
    }
  }
};

class MainMenu {
  render(){
    const div=document.createElement("div");div.className="menu";
    div.innerHTML=`<h1>&#9670; Shattered Realm &#9670;</h1>
      <button id="play">&#9654; Play</button>
      <button id="worlds">&#127758; Worlds</button>
      <button id="profile">&#128100; Profile</button>
      <button id="settings" style="background:#2e5aac;">&#9881; Settings</button>`;
    div.querySelector("#play").onclick=()=>App.switch(new PlayMenu());
    div.querySelector("#worlds").onclick=()=>App.switch(new WorldMenu());
    div.querySelector("#profile").onclick=()=>App.switch(new ProfileMenu());
    div.querySelector("#settings").onclick=()=>App.openSettings();
    return div;
  }
}

// Profile: set your in-game name
class ProfileMenu {
  render(){
    const div=document.createElement("div");div.className="menu";
    const name=App.data.profile.name||'Player';
    div.innerHTML=`<h1>&#128100; Profile</h1>
      <p style="color:#aaa;text-align:center;margin-bottom:6px;">Your name appears above your character in multiplayer.</p>
      <input id="pname" placeholder="Your name" value="${name}" maxlength="20">
      <button id="save" style="background:#4caf50;">&#10003; Save Name</button>
      <button id="back">Back</button>`;
    div.querySelector("#save").onclick=()=>{
      const n=div.querySelector("#pname").value.trim()||'Player';
      App.data.profile.name=n;App.save();
      div.querySelector("#save").textContent="Saved!";
      setTimeout(()=>div.querySelector("#save").textContent="✓ Save Name",1000);
    };
    div.querySelector("#back").onclick=()=>App.switch(new MainMenu());
    return div;
  }
}

// Play: choose a local world to launch (no room code)
class PlayMenu {
  render(){
    const div=document.createElement("div");div.className="menu";
    div.innerHTML=`<h1>Play — Local</h1>`;
    if(App.data.worlds.length===0)
      div.innerHTML+=`<p style="text-align:center;color:#888;">No worlds yet. Go to Worlds to create one!</p>`;
    App.data.worlds.forEach(world=>{
      const item=document.createElement("div");item.className="world-item";
      const hint=world.size==='Infinite'?'&#9830; Infinite':'';
      item.innerHTML=`<div><strong>${world.name}</strong> ${hint}<br><small>Seed: ${world.seed} | ${world.size}</small></div><button class="small-btn">Play</button>`;
      item.querySelector("button").onclick=()=>App.launchGame(world,{});
      div.appendChild(item);
    });
    const back=document.createElement("button");back.textContent="Back";back.onclick=()=>App.switch(new MainMenu());div.appendChild(back);
    return div;
  }
}

// Worlds: manage local worlds + multiplayer rooms (tabbed)
class WorldMenu {
  constructor(){this.tab='local';}
  render(){
    const div=document.createElement("div");div.className="menu";
    div.innerHTML=`<h1>Worlds</h1>
      <div class="tab-row">
        <button class="tab-btn${this.tab==='local'?' active':''}" id="t-local">&#127758; Local</button>
        <button class="tab-btn${this.tab==='mp'?' active':''}" id="t-mp">&#127760; Multiplayer</button>
      </div>
      <div id="tab-content"></div>`;
    div.querySelector("#t-local").onclick=()=>{this.tab='local';App.switch(this);};
    div.querySelector("#t-mp").onclick=()=>{this.tab='mp';App.switch(this);};
    const content=div.querySelector("#tab-content");
    if(this.tab==='local') this._renderLocal(content);
    else this._renderMP(content);
    const back=document.createElement("button");back.textContent="Back";back.onclick=()=>App.switch(new MainMenu());div.appendChild(back);
    return div;
  }
  _renderLocal(content){
    const create=document.createElement("button");
    create.textContent="+ Create New World";create.style.background="#4caf50";create.style.marginBottom="10px";
    create.onclick=()=>App.switch(new CreateWorldMenu());
    content.appendChild(create);
    if(App.data.worlds.length===0){
      const p=document.createElement("p");p.textContent="No local worlds yet.";p.style.color="#888";p.style.textAlign="center";
      content.appendChild(p);return;
    }
    App.data.worlds.forEach((world,index)=>{
      const item=document.createElement("div");item.className="world-item";
      item.innerHTML=`<div><strong>${world.name}</strong><br><small>Seed: ${world.seed} | ${world.size}</small></div>
        <div style="display:flex;gap:6px;">
          <button class="small-btn" style="background:#2e5aac;">&#9654; Play</button>
          <button class="small-btn mp-btn" style="background:#7b1fa2;">&#127760; Host MP</button>
          <button class="small-btn del-btn" style="background:#e53935;">&#128465;</button>
        </div>`;
      item.querySelector(".small-btn").onclick=()=>App.launchGame(world,{});
      item.querySelector(".mp-btn").onclick=()=>App.launchGame(world,{mp:true,isHost:true});
      item.querySelector(".del-btn").onclick=()=>{
        localStorage.removeItem('terrajs_world_'+world.created);
        App.data.worlds.splice(index,1);App.save();App.switch(new WorldMenu());
      };
      content.appendChild(item);
    });
  }
  _renderMP(content){
    const joinRow=document.createElement("div");joinRow.style.cssText="display:flex;gap:8px;margin-bottom:12px;";
    joinRow.innerHTML=`<input id="join-code" placeholder="Enter 6-char room code" maxlength="6" style="flex:1;text-transform:uppercase;letter-spacing:3px;font-size:15px;">
      <button style="background:#7b1fa2;padding:8px 14px;white-space:nowrap;">Join Room</button>`;
    const ci=joinRow.querySelector("input");
    ci.oninput=()=>ci.value=ci.value.toUpperCase().replace(/[^A-Z0-9]/g,'');
    joinRow.querySelector("button").onclick=()=>{
      const code=ci.value.trim().toUpperCase();
      if(code.length!==6){ci.style.borderColor='#e53935';setTimeout(()=>ci.style.borderColor='',1500);return;}
      // Auto-create a guest world if the player has none
      let world=App.data.worlds[0];
      if(!world){
        world={name:'Guest Session',seed:code,size:'Large',created:Date.now()};
        App.data.worlds.push(world);App.save();
      }
      // Save to recent rooms
      if(!App.data.mpWorlds.find(w=>w.code===code)){
        App.data.mpWorlds.unshift({code,name:`Room ${code}`,joined:Date.now()});
        if(App.data.mpWorlds.length>10)App.data.mpWorlds.pop();
        App.save();
      }
      App.launchGame(world,{mp:true,isHost:false,code});
    };
    content.appendChild(joinRow);
    if(App.data.mpWorlds.length===0){
      const p=document.createElement("p");p.textContent="No recent multiplayer rooms.";p.style.color="#888";p.style.textAlign="center";
      content.appendChild(p);return;
    }
    const label=document.createElement("p");label.textContent="Recent rooms:";label.style.color="#aaa";label.style.marginBottom="6px";
    content.appendChild(label);
    App.data.mpWorlds.forEach((mw,index)=>{
      const item=document.createElement("div");item.className="world-item";
      const d=new Date(mw.joined);
      item.innerHTML=`<div><strong>&#127760; ${mw.code}</strong><br><small>Last joined: ${d.toLocaleDateString()}</small></div>
        <div style="display:flex;gap:6px;">
          <button class="small-btn" style="background:#7b1fa2;">Rejoin</button>
          <button class="small-btn" style="background:#555;">&#128465;</button>
        </div>`;
      item.querySelectorAll(".small-btn")[0].onclick=()=>{
        let world=App.data.worlds[0];
        if(!world){world={name:'Guest Session',seed:mw.code,size:'Large',created:Date.now()};App.data.worlds.push(world);App.save();}
        App.launchGame(world,{mp:true,isHost:false,code:mw.code});
      };
      item.querySelectorAll(".small-btn")[1].onclick=()=>{
        App.data.mpWorlds.splice(index,1);App.save();App.switch(new WorldMenu());
      };
      content.appendChild(item);
    });
  }
}

class CreateWorldMenu {
  render(){
    const div=document.createElement("div");div.className="menu";const sv=generateSeed();
    div.innerHTML=`
      <h1>Create World</h1>
      <input id="name" placeholder="World Name" value="My New World">
      <input id="seed" value="${sv}" placeholder="Seed">
      <select id="size">
        <option value="Small">Small (200×100)</option>
        <option value="Large">Large (600×300)</option>
        <option value="Huge">Huge (2000×500)</option>
        <option value="Infinite">&#9830; Infinite (chunk-based)</option>
      </select>
      <div id="preview" style="margin-bottom:10px;color:#aaa;font-size:13px;">World Hash: ${hashSeed(sv)}</div>
      <div class="row">
        <button id="regen" style="background:#555;flex:1;">&#8635; Regen Seed</button>
        <button id="create" style="background:#4caf50;flex:2;">Create World</button>
      </div>
      <button id="back">Back</button>
    `;
    const si=div.querySelector("#seed"),pv=div.querySelector("#preview");
    si.oninput=()=>pv.textContent="World Hash: "+hashSeed(si.value);
    div.querySelector("#regen").onclick=()=>{si.value=generateSeed();si.dispatchEvent(new Event("input"));};
    div.querySelector("#create").onclick=()=>{
      App.data.worlds.push({name:div.querySelector("#name").value||"New World",seed:si.value,size:div.querySelector("#size").value,created:Date.now()});
      App.save();App.switch(new WorldMenu());
    };
    div.querySelector("#back").onclick=()=>App.switch(new WorldMenu());
    return div;
  }
}

class CharacterMenu {
  render(){
    const div=document.createElement("div");div.className="menu";div.innerHTML=`<h1>Characters</h1><button id="cc" style="background:#4caf50;">+ Create Character</button>`;
    App.data.characters.forEach((char,index)=>{
      const item=document.createElement("div");item.className="world-item";
      item.innerHTML=`<div><strong>${char.name}</strong><br><small>Class: ${char.class}</small></div><button class="small-btn" style="background:#e53935;">Delete</button>`;
      item.querySelector("button").onclick=()=>{App.data.characters.splice(index,1);App.save();App.switch(new CharacterMenu());};
      div.appendChild(item);
    });
    div.querySelector("#cc").onclick=()=>{
      const name=prompt("Character name?"),charClass=prompt("Class? (Warrior/Mage/Ranger)");
      if(name&&charClass){App.data.characters.push({name,class:charClass});App.save();App.switch(new CharacterMenu());}
    };
    const back=document.createElement("button");back.textContent="Back";back.onclick=()=>App.switch(new MainMenu());div.appendChild(back);
    return div;
  }
}

window.onload=()=>App.switch(new MainMenu());
</script>
